; Intern-Register 独立 supervisord 实例配置
; 🔴 2026-10-16：平台自带的 /etc/supervisor/conf.d/supervisord.conf 由
;    /entrypoint.sh 从模板重新生成，且 /etc 在容器重建时被重置 —— 我们的
;    业务程序（regloop/看板/irguard）会随之消失。
;    故改用**独立实例 + 独立 socket**，配置副本放 NAS（本目录），
;    容器重建后跑 deploy/supervisor/restore.sh 即可恢复。

[unix_http_server]
file=/var/run/supervisor-ir.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor-ir.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisord]
logfile=/var/log/supervisord-ir.log
pidfile=/var/run/supervisord-ir.pid
user=root
nodaemon=false

[include]
files = /etc/supervisor/conf.d/ir-services.conf
