# Intern-Register 业务进程（regloop + 看板 + 保活 + 隧道）
# 🔴 2026-10-16：容器重建会重置 overlay 上的 /etc 与 /root，本文件是**NAS 上的权威副本**。
#    恢复：bash /app/working/intern-register/deploy/supervisor/restore.sh
#
# 用法（独立实例，避开平台自带的 supervisord）：
#   supervisord -c /etc/supervisord-ir.conf

[program:regloop]
command=/bin/bash /app/working/intern-register/loop_run.sh
directory=/app/working/intern-register
autostart=true
autorestart=true
startsecs=15
startretries=1000
stopwaitsecs=30
environment=XDG_CACHE_HOME="/app/working/intern-register/.cache",DISPLAY=":1",TZ="Asia/Shanghai"
stdout_logfile=/app/working/intern-register/logs/regloop.out.log
stderr_logfile=/app/working/intern-register/logs/regloop.err.log

[program:ir-dashboard]
command=/usr/bin/python3 -u /app/working/intern-register/tools/ops/dashboard.py
directory=/app/working/intern-register
autostart=true
autorestart=true
startsecs=3
startretries=1000
stopwaitsecs=10
environment=IR_DASH_USER="admin",IR_DASH_PASS="irpanel",IR_DASH_PORT="8000",TZ="Asia/Shanghai"
stdout_logfile=/app/working/intern-register/logs/dashboard.out.log
stderr_logfile=/app/working/intern-register/logs/dashboard.err.log

[program:irguard]
command=/bin/bash /app/working/intern-register/tools/ops/irguard.sh
directory=/app/working/intern-register
autostart=true
autorestart=true
startsecs=3
startretries=1000
stopwaitsecs=10
environment=IR_ROOT="/app/working/intern-register",TZ="Asia/Shanghai"
stdout_logfile=/app/working/intern-register/logs/irguard.out.log
stderr_logfile=/app/working/intern-register/logs/irguard.err.log

# 🔴 隧道由我们托管，保证容器重建后 ingress（含 ir-qwenpaw-tom → :8000）能回来。
#    注意：起之前要先 pkill 掉平台/历史遗留的裸 cloudflared，否则旧配置的
#    连接器仍在线，会把流量分走（restore.sh 已处理）。
[program:cloudflared-tunnel]
command=/usr/local/bin/cloudflared --config /root/.cloudflared/config-new.yml tunnel run
autostart=true
autorestart=true
startsecs=5
startretries=1000
stopwaitsecs=10
stdout_logfile=/app/working/intern-register/logs/cloudflared.out.log
stderr_logfile=/app/working/intern-register/logs/cloudflared.err.log

# ── key 小时级同步到 GitHub 私库（2026-10-17）──────────────────
# 凭据在 .workbuddy-ai/git-creds（NAS 持久卷，0600）；remote URL 不含 token。
[program:key-sync]
command=/bin/bash /app/working/intern-register/tools/ops/key_sync_loop.sh
directory=/app/working/intern-register
autostart=true
autorestart=true
startsecs=10
startretries=1000
stopwaitsecs=20
stdout_logfile=/app/working/intern-register/logs/key_sync_sup.out.log
stderr_logfile=/app/working/intern-register/logs/key_sync_sup.err.log

# ── 窗口猎手（2026-10-18）：T001 风控时代专职收割 key 产能引擎 ──
# 探测登录窗口（直连/全新指纹），开窗即爆发收割 keyless 存量。
[program:window-hunter]
command=/bin/bash -c 'cd /app/working/intern-register && DISPLAY=:1 TZ=Asia/Shanghai XDG_CACHE_HOME=/app/working/intern-register/.cache .venv/bin/python -u tools/ops/window_hunter.py'
directory=/app/working/intern-register
autostart=true
autorestart=true
startsecs=15
startretries=1000
stopwaitsecs=30
stdout_logfile=/app/working/intern-register/logs/window_hunter_sup.out.log
stderr_logfile=/app/working/intern-register/logs/window_hunter_sup.err.log
