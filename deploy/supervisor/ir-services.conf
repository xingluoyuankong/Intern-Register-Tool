# Intern-Register 业务进程（regloop + 看板 + 保活）
# 🔴 2026-10-16：容器重建会重置 overlay 上的 /etc，本文件是**NAS 上的权威副本**。
#    恢复：把本目录同步回 /etc 并拉起独立 supervisord，见 deploy/supervisor/restore.sh
#
# 用法（独立实例，避开平台自带的 supervisord）：
#   supervisord -c /etc/supervisord-ir.conf

[program:regloop]
command=/bin/bash /app/working/intern-register/loop_run.sh
directory=/app/working/intern-register
autostart=true
autorestart=true
startsecs=15
startretries=1000
stopwaitsecs=30
environment=XDG_CACHE_HOME="/app/working/intern-register/.cache",DISPLAY=":1"
stdout_logfile=/app/working/intern-register/logs/regloop.out.log
stderr_logfile=/app/working/intern-register/logs/regloop.err.log

[program:ir-dashboard]
command=/usr/bin/python3 -u /app/working/intern-register/tools/ops/dashboard.py
directory=/app/working/intern-register
autostart=true
autorestart=true
startsecs=3
startretries=1000
stopwaitsecs=10
environment=IR_DASH_USER="admin",IR_DASH_PASS="irpanel",IR_DASH_PORT="8000"
stdout_logfile=/app/working/intern-register/logs/dashboard.out.log
stderr_logfile=/app/working/intern-register/logs/dashboard.err.log

[program:irguard]
command=/bin/bash /app/working/intern-register/tools/ops/irguard.sh
directory=/app/working/intern-register
autostart=true
autorestart=true
startsecs=3
startretries=1000
stopwaitsecs=10
environment=IR_ROOT="/app/working/intern-register"
stdout_logfile=/app/working/intern-register/logs/irguard.out.log
stderr_logfile=/app/working/intern-register/logs/irguard.err.log
